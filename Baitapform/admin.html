<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Dieuthao Admin</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

        :root {
            --bg: #03000a;
            --accent-cyan: #00d2ff;
            --accent-purple: #9d50bb;
            --error: #ff3366;
            --success: #00ff88;
            --glass: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.1);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0; background: var(--bg); color: #fff;
            display: flex; min-height: 100vh;
        }

        .sidebar {
            width: 260px; border-right: 1px solid var(--border);
            padding: 40px 20px; background: rgba(0,0,0,0.3); backdrop-filter: blur(20px);
            display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
        }

        .logo {
            font-family: 'Orbitron'; font-size: 1.5rem; letter-spacing: 3px;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple)) !important;
            -webkit-background-clip: text !important; background-clip: text !important;
            -webkit-text-fill-color: transparent !important; color: transparent !important;
            margin-bottom: 30px;
        }

        .main-content { flex: 1; padding: 40px; overflow-y: auto; }

        .toolbar { display: flex; gap: 15px; margin-bottom: 25px; align-items: center; }

        .search-bar {
            flex: 1; padding: 12px 20px; background: var(--glass);
            border: 1px solid var(--border); border-radius: 12px;
            color: #fff; outline: none; transition: 0.3s;
        }
        .search-bar:focus { border-color: var(--accent-cyan); }

       
        .btn {
            padding: 10px 18px; border-radius: 10px; cursor: pointer;
            font-family: 'Orbitron'; font-size: 0.65rem; font-weight: 700;
            border: 1px solid transparent; transition: 0.3s; text-transform: uppercase;
        }
        .btn-excel { background: rgba(0, 255, 136, 0.1); color: var(--success); border-color: var(--success); }
        .btn-excel:hover { background: var(--success); color: #000; }
        
        .btn-delete { background: rgba(255, 51, 102, 0.1); color: var(--error); border-color: var(--error); }
        .btn-delete:hover { background: var(--error); color: #fff; }

        .btn-restore { background: rgba(0, 210, 255, 0.1); color: var(--accent-cyan); border-color: var(--accent-cyan); }
        .btn-restore:hover { background: var(--accent-cyan); color: #000; }

       
        .section-title { font-family: 'Orbitron'; font-size: 0.9rem; margin: 40px 0 15px; color: var(--accent-cyan); display: flex; align-items: center; gap: 10px; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: var(--border); }

        .table-container { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { background: rgba(255,255,255,0.03); padding: 15px 20px; font-family: 'Orbitron'; font-size: 0.6rem; opacity: 0.6; letter-spacing: 1px; }
        td { padding: 15px 20px; border-bottom: 1px solid var(--border); font-size: 0.8rem; vertical-align: middle; }
        
        
        .interest-pill {
            font-size: 0.65rem; 
            background: linear-gradient(45deg, rgba(0, 210, 255, 0.1), rgba(157, 80, 187, 0.1));
            padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border);
            margin: 2px; display: inline-block; color: var(--accent-cyan);
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">DIEUTHAO</div>
        <p style="font-size: 0.6rem; opacity: 0.4; margin-top: -25px; margin-bottom: 40px; font-family: 'Orbitron';">CENTRAL DATABASE</p>
        
        <button class="btn btn-excel" onclick="exportToExcel()" style="width: 100%;">
            📊 EXPORT EXCEL
        </button>
        
        <div style="margin-top: auto; font-size: 0.55rem; opacity: 0.3; text-align: center; line-height: 1.5;">
            ENCRYPTION: AES-256<br>STATUS: ACTIVE
        </div>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <input type="text" id="searchInput" class="search-bar" placeholder="Tìm kiếm theo tên, username, sở thích..." onkeyup="filterData()">
        </div>

        <div class="section-title">ACTIVE_LOGS</div>
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>USERNAME</th>
                        <th>FIRST NAME</th>
                        <th>LAST NAME</th>
                        <th>BIRTHDAY</th>
                        <th>INTERESTS</th> <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="activeTable"></tbody>
            </table>
        </div>

        <div class="section-title" style="color: var(--error);">RECYCLE_BIN</div>
        <div class="table-container" style="border-color: rgba(255, 51, 102, 0.2); opacity: 0.8;">
            <table>
                <thead>
                    <tr>
                        <th>USERNAME</th>
                        <th>FULL NAME</th>
                        <th>ACTION</th>
                    </tr>
                </thead>
                <tbody id="trashTable"></tbody>
            </table>
        </div>
    </div>

    <script>
        function render() {
            const users = JSON.parse(localStorage.getItem('dieuthao_users') || '[]');
            const trash = JSON.parse(localStorage.getItem('dieuthao_trash') || '[]');

           
            document.getElementById('activeTable').innerHTML = users.length ? users.map(u => `
                <tr>
                    <td style="color: var(--accent-cyan); font-weight: 600;">${u.username}</td>
                    <td>${u.fname}</td>
                    <td>${u.lname}</td>
                    <td style="opacity: 0.7;">${u.birthday}</td>
                    <td>
                        ${(u.interests || []).map(i => `<span class="interest-pill">${i}</span>`).join('')}
                    </td>
                    <td><button class="btn btn-delete" onclick="moveToTrash(${u.id})">DELETE</button></td>
                </tr>
            `).reverse().join('') : '<tr><td colspan="6" style="text-align:center; opacity:0.3; padding:30px;">DATABASE EMPTY</td></tr>';

           
            document.getElementById('trashTable').innerHTML = trash.length ? trash.map(u => `
                <tr>
                    <td style="opacity: 0.5;">${u.username}</td>
                    <td>${u.fname} ${u.lname}</td>
                    <td style="display:flex; gap:10px;">
                        <button class="btn btn-restore" onclick="restoreUser(${u.id})">RESTORE</button>
                        <button class="btn" style="color: #666; border-color: #333;" onclick="permanentlyDelete(${u.id})">PURGE</button>
                    </td>
                </tr>
            `).reverse().join('') : '<tr><td colspan="3" style="text-align:center; opacity:0.2; padding:20px;">TRASH EMPTY</td></tr>';
        }

        function moveToTrash(id) {
            let users = JSON.parse(localStorage.getItem('dieuthao_users') || '[]');
            let trash = JSON.parse(localStorage.getItem('dieuthao_trash') || '[]');
            const idx = users.findIndex(u => u.id === id);
            if (idx > -1) {
                trash.push(users[idx]);
                users.splice(idx, 1);
                save(users, trash);
            }
        }

        function restoreUser(id) {
            let users = JSON.parse(localStorage.getItem('dieuthao_users') || '[]');
            let trash = JSON.parse(localStorage.getItem('dieuthao_trash') || '[]');
            const idx = trash.findIndex(u => u.id === id);
            if (idx > -1) {
                users.push(trash[idx]);
                trash.splice(idx, 1);
                save(users, trash);
            }
        }

        function permanentlyDelete(id) {
            if(confirm("Xác nhận hủy vĩnh viễn dữ liệu?")) {
                let trash = JSON.parse(localStorage.getItem('dieuthao_trash') || '[]');
                trash = trash.filter(u => u.id !== id);
                localStorage.setItem('dieuthao_trash', JSON.stringify(trash));
                render();
            }
        }

        function save(u, t) {
            localStorage.setItem('dieuthao_users', JSON.stringify(u));
            localStorage.setItem('dieuthao_trash', JSON.stringify(t));
            render();
        }

        function exportToExcel() {
            const users = JSON.parse(localStorage.getItem('dieuthao_users') || '[]');
            if(!users.length) return alert("No data to export!");

            let csv = "\uFEFFUsername,First Name,Last Name,Birthday,Interests\n";
            users.forEach(u => {
                csv += `${u.username},${u.fname},${u.lname},${u.birthday},"${(u.interests||[]).join('; ')}"\n`;
            });

            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Dieuthao_Database.csv";
            link.click();
        }

        function filterData() {
            const val = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#activeTable tr').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? "" : "none";
            });
        }

        window.addEventListener('storage', render);
        window.onload = render;
    </script>
</body>
</html>
