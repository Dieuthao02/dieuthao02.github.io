<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Registration</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');

    :root {
        --bg: #03000a;
        --accent: #00d2ff;
        --accent-glow: rgba(0, 210, 255, 0.4);
        --glass: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.1);
        --input-bg: rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

    body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: var(--bg);
        background-image: 
            radial-gradient(circle at 10% 20%, rgba(0, 210, 255, 0.05) 0%, transparent 20%),
            radial-gradient(circle at 90% 80%, rgba(0, 90, 142, 0.1) 0%, transparent 20%),
            radial-gradient(circle at 50% 50%, #0a0e1a 0%, #03000a 100%);
        color: #fff;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
    }

    .main-container {
        width: 90%;
        max-width: 650px;
        background: var(--glass);
        padding: 40px;
        backdrop-filter: blur(30px);
        -webkit-backdrop-filter: blur(30px);
        border: 1px solid var(--border);
        border-radius: 40px;
        box-shadow: 
            0 25px 50px -12px rgba(0, 0, 0, 0.5),
            inset 0 0 20px rgba(255, 255, 255, 0.02);
        animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .form-header {
        font-family: 'Orbitron';
        font-size: 1.5rem;
        background: linear-gradient(135deg, #fff 30%, var(--accent) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        text-align: center;
        margin-bottom: 40px;
        letter-spacing: 4px;
        font-weight: 700;
    }

    .input-group {
        margin-bottom: 20px;
        display: grid;
        grid-template-columns: 160px 1fr; 
        gap: 15px;
        align-items: center;
    }

    .label {
        font-size: 0.7rem; 
        font-weight: 600;
        color: #888;
        text-transform: uppercase;
        letter-spacing: 1px;
        white-space: nowrap; 
    }

    input[type="text"], 
    input[type="password"], 
    textarea, 
    select {
        background: var(--input-bg);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 12px 18px;
        color: #fff;
        font-family: inherit;
        font-size: 0.9rem;
        transition: all 0.3s ease;
        outline: none;
        width: 100%;
        box-sizing: border-box;
    }

    input:focus, textarea:focus, select:focus {
        background: rgba(255, 255, 255, 0.08);
        border-color: var(--accent);
        box-shadow: 0 0 20px var(--accent-glow);
        transform: translateY(-1px);
    }

    .input-group div[style*="flex"] {
        display: flex !important;
        gap: 10px !important;
    }

    .check-group { display: flex; gap: 20px; flex-wrap: wrap; }
    .check-group label {
        cursor: pointer;
        font-size: 0.85rem;
        display: flex;
        align-items: center;
        gap: 8px;
        color: #aaa;
        transition: 0.2s;
    }
    .check-group label:hover { color: var(--accent); }

    .lang-container {
        display: flex;
        flex-wrap: nowrap; 
        gap: 8px;
        justify-content: flex-start;
    }

    .lang-chip {
        padding: 6px 10px;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 0.65rem; 
        font-weight: 600;
        cursor: pointer;
        transition: 0.3s;
        text-align: center;
        flex: 1; 
        white-space: nowrap;
    }

    .lang-chip.active {
        background: var(--accent);
        color: #03000a;
        border-color: var(--accent);
        box-shadow: 0 0 10px var(--accent-glow);
    }

    .btn-row { margin-top: 40px; display: flex; gap: 15px; }
    .btn-row button {
        flex: 1;
        padding: 16px;
        border-radius: 16px;
        font-family: 'Orbitron';
        font-weight: 700;
        cursor: pointer;
        transition: 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        text-transform: uppercase;
        letter-spacing: 2px;
        font-size: 0.8rem;
    }

    .btn-submit {
        background: var(--accent);
        color: #03000a;
        border: none;
        box-shadow: 0 8px 20px rgba(0, 210, 255, 0.2);
    }
    .btn-submit:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 30px rgba(0, 210, 255, 0.4);
        filter: brightness(1.1);
    }

    .btn-reset {
        background: transparent;
        color: #fff;
        border: 1px solid var(--border);
    }
    .btn-reset:hover {
        background: rgba(255, 255, 255, 0.05);
        border-color: #ff4b2b;
        color: #ff4b2b;
    }

    option { background: #0a0e1a; color: #fff; }

    @media (max-width: 600px) {
        .input-group { grid-template-columns: 1fr; gap: 5px; }
        .main-container { padding: 25px; border-radius: 25px; }
    }
</style>
</head>
<body onload="play()">

<div class="main-container">
    <div class="left-side">
        <div class="form-header">REGISTER NEW ACCOUNT</div>
        <form name="frmRegister" onsubmit="return formValid(event)">
            <div class="input-group">
                <div class="label">Username</div>
                <input type="text" name="txtUsername">
            </div>
            <div class="input-group">
                <div class="label">Password</div>
                <input type="password" name="txtPassword1">
            </div>
            <div class="input-group">
                <div class="label">Confirm password</div>
                <input type="password" name="txtPassword2">
            </div>
            
            <div class="input-group">
                <div class="label">Gender</div>
                <div class="check-group">
                    <label><input type="radio" name="rdGender" value="Male" checked> Male</label>
                    <label><input type="radio" name="rdGender" value="Female"> Female</label>
                </div>
            </div>

            <div class="input-group">
                <div class="label">Phone</div>
                <input type="text" name="txtPhone" placeholder="0XXXXXXXXX">
            </div>
            <div class="input-group">
                <div class="label">Email</div>
                <input type="text" name="txtEmail">
            </div>

            <div class="input-group">
                <div class="label">Birthday</div>
                <div style="display: flex; gap: 10px;">
                    <select id="monthSelect" name="selMonth" style="flex: 2;"></select>
                    <input type="text" id="birth_day" name="txtDay" placeholder="DD" style="flex: 1; text-align: center;">
                    <input type="text" id="birth_year" name="txtYear" placeholder="YYYY" style="flex: 1.5; text-align: center;">
                </div>
            </div>
            
            <div class="input-group">
                <div class="label">Favourite</div>
                <div class="check-group">
                    <label><input type="checkbox" name="chkMusic"> Music</label>
                    <label><input type="checkbox" name="chkReading"> Reading</label>
                    <label><input type="checkbox" name="chkFilms"> Films</label>
                    <label><input type="checkbox" name="chkSports"> Sports</label>
                </div>
            </div>

            <div class="input-group">
                <div class="label">Picture</div>
                <input type="file" name="filPicture">
            </div>

            <div class="input-group">
                <div class="label">Description</div>
                <textarea name="txtDescription" rows="2"></textarea>
            </div>

            <div class="input-group">
                <div class="label">Education</div>
                <select name="selEdu">
                    <option value="Aptech">Aptech</option>
                    <option value="University">University</option>
                    <option value="HighSchool">High School</option>
                </select>
            </div>

            <div class="input-group">
                <div class="label">Language</div>
                <div class="lang-container" id="langBox">
                    <div class="lang-chip" onclick="toggleLang(this)">Vietnamese</div>
                    <div class="lang-chip" onclick="toggleLang(this)">English</div>
                    <div class="lang-chip" onclick="toggleLang(this)">French</div>
                    <div class="lang-chip" onclick="toggleLang(this)">Japanese</div>
                </div>
            </div>

            <div class="btn-row">
                <button type="submit" class="btn-submit">REGISTER</button>
                <button type="reset" class="btn-reset">RESET</button>
            </div>
        </form>
    </div>
</div>

<script>
    function toggleLang(el) {
        el.classList.toggle('active');
    }
   
    function formValid(e) {
        var f = document.frmRegister;
        var phone_pattern = /^(\(0\d{1,3}\)\d{7})|(0\d{9,10})$/;
        var email_pattern = /^[a-zA-Z]\w*(\.\w+)*@\w+(\.\w{2,3})+$/;

        if(f.txtUsername.value == "") {
            alert("Username can't be empty");
            f.txtUsername.focus();
            return false;
        }
        if(f.txtPassword1.value.length < 6) {
            alert("Password length must be from 6 to 20 characters");
            f.txtPassword1.focus();
            return false;
        }
        if(f.txtPassword1.value != f.txtPassword2.value) {
            alert("Password doesn't match");
            f.txtPassword2.focus();
            return false;
        }
        if (!phone_pattern.test(f.txtPhone.value)) {
            alert("Invalid phone number!");
            f.txtPhone.focus();
            return false;
        }
        if (!email_pattern.test(f.txtEmail.value)) {
            alert("Invalid email address");
            f.txtEmail.focus();
            return false;
        }
        if(!f.chkMusic.checked && !f.chkReading.checked) {
            alert("You must select at least one favourite");
            return false;
        }
        if(f.filPicture.value == "") {
            alert("Please select your picture");
            return false;
        }
        if(f.txtDescription.value == "") {
            alert("Please enter description");
            f.txtDescription.focus();
            return false;
        }

        alert("All register information are correct.");
        return true;
    }

    const monthNames = ["January", "February", "March", "April", "May", "June",
    "July", "August", "September", "October", "November", "December"];
    const select = document.getElementById('monthSelect');
    if (select.options.length === 0) { 
        monthNames.forEach((month, index) => {
            let opt = document.createElement('option');
            opt.value = index + 1;
            opt.innerHTML = month;
            select.appendChild(opt);
        });
    }
</script>
</body>
</html>
